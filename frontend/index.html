<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>炉石酒馆 · 本地战棋</title></head><body>
<main id="table" aria-label="酒馆棋盘">
<header><select id="scene" aria-label="开始新对局"><option value="target">定向施法</option><option value="recruit">招募练习</option><option value="triple">三连发现</option><option value="collision">碰撞伤害</option><option value="deathrattle">亡语战斗</option><option value="reborn">复生战斗</option><option value="hero_damage">英雄受伤</option><option value="mechanics">机制测试</option><option value="late">中盘对局</option><option value="showcase">特效展示</option><option value="random">随机对局</option></select><button id="restart" title="重新开局">重开</button><select id="language" aria-label="语言"></select></header>
<div id="tier" role="img"></div><div id="phase"></div><aside id="seats" aria-label="玩家列表"></aside><div id="tools"></div>
<div id="end"></div><div id="hero" aria-label="己方英雄"></div><div id="enemy-hero" aria-label="对方英雄" hidden></div><div id="gold"></div>
<div id="status" role="status"></div><div id="choices" hidden></div><div id="tooltip" hidden></div>
<svg id="arrow" viewBox="0 0 1440 810" aria-hidden="true"><defs><marker id="tip" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="#ffcd57"/></marker></defs><path id="curve" fill="none" stroke="#ffcd57" stroke-width="6" marker-end="url(#tip)"/></svg>
</main><script type="module" src="/src/board.ts"></script></body></html>
